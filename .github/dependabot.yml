# Dependency-update automation (issue #134). `pnpm audit` in security-scan.yml only
# flags known CVEs; this proactively opens upgrade PRs — which also keeps the
# SHA-pinned third-party actions (#129 M2) moving instead of frozen forever.
# Volume control: weekly cadence, minor+patch grouped into one PR per ecosystem,
# majors arrive individually under a small open-PR cap.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7.0 is the native (Go) rewrite; tsup / rollup-plugin-dts don't
      # support it yet — the build crashes in .d.ts generation
      # (`Cannot read properties of undefined (reading 'useCaseSensitiveFileNames')`).
      # Revisit once the bundler toolchain supports the native compiler. (#151)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node must track the runtime, which is Node 24 (engines `>=24`,
      # CI runs node-version 24). Node 26 typings tighten lib types (e.g.
      # `Uint8Array<ArrayBufferLike>` no longer a `BlobPart`) and break the
      # typecheck. Bump this major only when the runtime moves to Node 26. (#161)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The AI SDK ships version-aligned families: `ai@5` pairs with
      # `@ai-sdk/openai-compatible@1`, `ai@7` with `@ai-sdk/openai-compatible@3`
      # (returns `LanguageModelV4`, incompatible with our `ai@5` `LanguageModel`).
      # A standalone major bump can't compile — the whole family must move in
      # lockstep as a deliberate migration. (#160)
      - dependency-name: "@ai-sdk/openai-compatible"
        update-types: ["version-update:semver-major"]
    commit-message:
      # Satisfy commitlint (Conventional Commits) on the PR title.
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
