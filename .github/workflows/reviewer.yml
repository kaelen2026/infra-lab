name: reviewer

# 每个 Pull Request 的「AI 自动代码审查」:复用 infra-lab-bot 的凭证与 claude-code-action,
# 让 Opus 4.8 以只读方式审查本次 PR 的改动,把意见发成**行内评论 + 顶层总结**(见
# .github/prompts/reviewer.md)。以自定义 GitHub App 身份 infra-lab-bot[bot] 发言。
#
# 与其它审查/扫描互补:@infra-lab-bot 是「被 @ 才应答」的通用助手(infra-lab-bot.yml);
# security-patrol 是「每周深度安全巡检」;本工作流是「每次 PR 自动过一遍」。
#
# 顶层总结的最后一行是机器可读判定 `VERDICT: LGTM|REWORK`(契约见 prompts/reviewer.md):
# rework.yml 据此对 bot 工单分支(bot/*)的 PR 触发自动返工,人类 PR 上它只是信息。
#
# 依赖的仓库 secrets:
#   CLAUDE_CODE_OAUTH_TOKEN                            Claude 鉴权(`claude setup-token`)
#   INFRA_LAB_BOT_PRIVATE_KEY                          infra-lab-bot GitHub App 私钥(评论归属到 bot;
#                                                      Client ID 是公开值,直接内联在下面)
#
# 注:仅审查**本仓库内**发起的 PR。公共仓库里来自 fork 的 PR 拿不到 secrets,
# 会被下面的 `if` 跳过,既避免失败噪声,也不把凭证暴露给外部代码。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 同一 PR 有新提交时,取消尚未跑完的旧审查,只审最新改动。
concurrency:
  group: reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 审查是只读的:读代码(contents:read),把意见写成 PR 评论(pull-requests:write)。
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI code review
    runs-on: ubuntu-latest
    # 跳过草稿 PR,以及来自 fork 的 PR(后者拿不到 secrets)。
    # 同样跳过 dependabot PR:dependabot 触发的运行读的是 Dependabot 专属 secret 池
    # (没有 INFRA_LAB_BOT_PRIVATE_KEY / CLAUDE_CODE_OAUTH_TOKEN),铸 App token 一步
    # 就会报错挂红;而依赖升级 diff 只有 manifest+lockfile,AI 审查价值也低——
    # 质量门禁交给 CI(lint/typecheck/build/test)+ pnpm audit。
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    steps:
      # 用 infra-lab-bot App 铸一个短期 installation token,让审查评论归属到 infra-lab-bot[bot]。
      - name: Generate infra-lab-bot app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 (Node 24)
        with:
          # Client ID(公开值,非 secret)——v3 弃用了数字 `app-id`。
          client-id: Iv23liQcsfKzRONudnfm
          private-key: ${{ secrets.INFRA_LAB_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      # prompt = 审查基础模板 + 本次 PR 的 REPO / 编号。二者非用户可控文本,经 env 传入。
      - name: Build review prompt
        id: build-prompt
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'value<<PROMPT_EOF'
            cat .github/prompts/reviewer.md
            printf '\n本次 PR:REPO=%s PR NUMBER=#%s(PR 分支已检出到当前工作目录)。\n' "$REPO" "$PR_NUMBER"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code (review)
        uses: anthropics/claude-code-action@dcb57747bfceeaa1fa72638cae52295d1d853d4a # v1.0.199
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 以 infra-lab-bot App 身份发评论,而非默认 claude[bot]。
          github_token: ${{ steps.app-token.outputs.token }}
          # infra-lab-bot 会自己开 PR;claude-code-action 默认拦 bot 发起的运行,
          # 不放行的话 bot 作者的 PR 全被拒审(恰恰是最该被审的)。只放这一个 bot,
          # 不用 "*"。审查是只读、只发行内评论,评论又以 infra-lab-bot[bot] 身份发出,
          # 会被 infra-lab-bot.yml 的回环防护跳过,不会触发新的 bot 运行。
          allowed_bots: "infra-lab-bot"
          prompt: ${{ steps.build-prompt.outputs.value }}
          # Opus 4.8;放开发评论所需的工具(行内评论 MCP + gh pr 只读/评论命令)。
          claude_args: '--model claude-opus-4-8 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
