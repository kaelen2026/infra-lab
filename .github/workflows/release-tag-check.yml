name: release-tag-check

# Every app releases under a tag `{app}_v{version}` (see docs/deployment.md).
# This runs on ANY such tag and enforces two invariants:
#   1. {version} in the tag equals the app's declared version source —
#      package.json for TS apps, project.json for native apps.
#   2. For native apps, project.json equals the platform manifest that actually
#      ships (iOS MARKETING_VERSION / Android versionName / Harmony versionName),
#      so a release tag can't drift from the built artifact's version.
#
# deploy.yml and release-images.yml only react to the hosted/image apps
# (api/web/h5/bot); for ios/android/harmony/cli/miniprogram this is the ONLY gate
# that ties the tag to a real version.
on:
  push:
    tags: ["*_v*"]

permissions:
  contents: read

concurrency:
  group: release-tag-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Verify tag ↔ version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          app="${REF_NAME%%_*}"        # api_v0.1.0 -> api
          version="${REF_NAME#*_v}"    # api_v0.1.0 -> 0.1.0
          echo "Tag '$REF_NAME' -> app='$app' version='$version'"

          # Official release apps only — everything else is rejected.
          case "$app" in
            api|web|h5|cli|miniprogram|bot) kind=ts ;;
            ios|android|harmony) kind=native ;;
            *) echo "::error::'$app' is not an official release app (tag '$REF_NAME'). Allowed: api web h5 cli miniprogram bot ios android harmony"; exit 1 ;;
          esac

          if [ "$kind" = ts ]; then
            src="apps/$app/package.json"
          else
            src="apps/$app/project.json"
          fi
          declared="$(node -p "require('./$src').version || ''")"
          if [ -z "$declared" ]; then
            echo "::error::no version field in $src"; exit 1
          fi
          if [ "$declared" != "$version" ]; then
            echo "::error::tag version '$version' != $src version '$declared' — bump $src or fix the tag"; exit 1
          fi
          echo "✓ $src version '$declared' matches the tag."

          # Native: project.json (version + buildNumber) must equal the platform
          # manifest that actually ships.
          if [ "$kind" = native ]; then
            pj_build="$(node -p "require('./$src').buildNumber ?? ''")"
            if [ -z "$pj_build" ]; then echo "::error::no buildNumber in $src"; exit 1; fi
            case "$app" in
              ios)
                # .xcodeproj is generated by XcodeGen and gitignored; project.yml is the source.
                manifest="apps/ios/project.yml"
                m_version="$(sed -n 's/.*MARKETING_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest" | sort -u | paste -sd' ' -)"
                m_build="$(sed -n 's/.*CURRENT_PROJECT_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest" | sort -u | paste -sd' ' -)"
                label="iOS project.yml (MARKETING_VERSION/CURRENT_PROJECT_VERSION)" ;;
              android)
                manifest="apps/android/app/build.gradle.kts"
                m_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' "$manifest" | sort -u | paste -sd' ' -)"
                m_build="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' "$manifest" | sort -u | paste -sd' ' -)"
                label="Android build.gradle.kts (versionName/versionCode)" ;;
              harmony)
                manifest="apps/harmony/AppScope/app.json5"
                m_version="$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest" | sort -u | paste -sd' ' -)"
                m_build="$(sed -n 's/.*"versionCode"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' "$manifest" | sort -u | paste -sd' ' -)"
                label="Harmony app.json5 (versionName/versionCode)" ;;
            esac
            if [ "$m_version" != "$declared" ] || [ "$m_build" != "$pj_build" ]; then
              echo "::error::$label ('$m_version'/'$m_build') != $src (version '$declared', buildNumber '$pj_build') — keep the platform manifest and project.json in sync"; exit 1
            fi
            echo "✓ $label matches $src (version '$declared', buildNumber '$pj_build')."
          fi
