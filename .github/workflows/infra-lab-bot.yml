name: infra-lab-bot

# Surface who initiated the run in the Actions run list. Feishu dispatches pass a
# resolved sender name (falls back to open_id); manual `gh workflow run` and comment
# triggers have no sender input, so fall back to github.actor (the dispatcher / commenter).
run-name: >-
  infra-lab-bot · ${{ inputs.feishu_sender_name || inputs.feishu_sender || github.actor }}

# Mention @infra-lab-bot in an issue comment or a pull-request comment and this
# runs claude-code-action to respond. Can also be dispatched manually
# (`gh workflow run infra-lab-bot.yml -f prompt="..."`) to run a one-off task —
# in that mode there is no comment thread, so output lands in the Actions run.
#
# Ticket intake: labeling an issue `bot` runs the same job with the ticket prompt
# (.github/prompts/ticket.md) — the bot implements the issue on a `bot/<n>-<slug>`
# branch and opens a PR; rework.yml then drives that PR to green (the "跟单" half
# of the loop). Lifecycle docs: docs/infra-lab-bot.md.
#
# Two independent credentials:
#   - Claude (Anthropic) auth: CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`).
#   - GitHub identity: a *custom* GitHub App named "infra-lab-bot" — the workflow mints
#     an installation token from its Client ID + private key so comments/commits are
#     attributed to infra-lab-bot[bot] instead of the default claude[bot].
#     The Client ID is public (inlined below); the private key is secret
#     INFRA_LAB_BOT_PRIVATE_KEY. Needs the app installed on this repo with
#     Contents/Issues/Pull requests read & write.
#
# Feishu closed loop: apps/bot dispatches this workflow with `feishu_message_id` set.
# The final step then replies the run's result back into that Feishu message's thread —
# needs repo secrets LARK_APP_ID + LARK_APP_SECRET (and optional var LARK_DOMAIN).
on:
  workflow_dispatch:
    inputs:
      prompt:
        # Can be short — it's appended to the base prompt in .github/prompts/infra-lab-bot.md.
        description: "Task for infra-lab-bot (combined with the base prompt template)"
        required: false
        default: "分析一下当前项目"
      feishu_message_id:
        # Set by apps/bot. When non-empty, the run's result is replied back into this
        # Feishu message's thread. Empty (default) for human `gh workflow run` dispatches.
        description: "Feishu message id to reply the result into (leave empty for manual runs)"
        required: false
        default: ""
      feishu_sender:
        # Set by apps/bot: the Feishu open_id of whoever @-mentioned the bot. Surfaced
        # in run-name for audit. Empty for manual runs.
        description: "Feishu sender open_id (who initiated; leave empty for manual runs)"
        required: false
        default: ""
      feishu_sender_name:
        # Set by apps/bot: the resolved display name of the sender (open_id → name via
        # the contact API). May be empty if resolution failed; run-name then falls back
        # to feishu_sender, then github.actor.
        description: "Feishu sender display name (leave empty for manual runs)"
        required: false
        default: ""
      thread_key:
        # Set by apps/bot: stable key of the Feishu thread (root_id, or the first
        # message's id). Non-empty enables same-thread session reuse — concurrency
        # serializes runs of the same thread and ~/.claude is cached per thread.
        # Empty (default) for manual runs / other events: no session reuse.
        description: "Feishu thread key for session reuse (leave empty for manual runs)"
        required: false
        default: ""
      session_uuid:
        # Set by apps/bot: uuidv5(NAMESPACE, thread_key) — a stable Claude Code session
        # UUID. Non-empty makes the run resume that session (`--resume`, cache hit) or
        # create it under this exact UUID (`--session-id`, first run of the thread).
        description: "Stable Claude Code session UUID for this thread (leave empty for manual runs)"
        required: false
        default: ""
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]

# Serialize runs that share a thread:
# - Feishu dispatch with thread_key → group per Feishu thread. cancel-in-progress=false
#   is load-bearing: same-thread messages must queue, or two runs would write the same
#   session.jsonl concurrently and corrupt it for the next resume.
# - Issue/PR events (label intake, mentions) → group per issue number, so a
#   double-labeled issue or rapid mentions never run concurrently; the surviving run
#   re-reads the whole thread anyway.
# - Anything else (manual dispatch without thread_key) → run_id, i.e. unconstrained.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' && inputs.thread_key != '')
        && format('infra-lab-bot-thread-{0}', inputs.thread_key)
        || format('infra-lab-bot-{0}', github.event.issue.number || github.run_id) }}
  cancel-in-progress: false

jobs:
  infra-lab-bot:
    # Run on manual dispatch, or when the mention phrase appears in a comment.
    # `issue_comment` fires for both issue and PR conversation comments;
    # `pull_request_review_comment` covers inline code-review comments.
    #
    # Loop guard: skip comments authored by infra-lab-bot itself. The bot acts via an
    # App installation token, and events from such tokens DO trigger other workflows
    # (unlike the built-in GITHUB_TOKEN, which is suppressed). So the bot's own reply —
    # which may echo "@infra-lab-bot" — would otherwise re-trigger this workflow in an
    # endless loop, each iteration now a full-permission run. `workflow_dispatch`
    # (Feishu bridge / manual) is a separate branch and intentionally not filtered.
    #
    # Trust gate: comment triggers additionally require the commenter to be
    # OWNER/MEMBER/COLLABORATOR. Today the repo is private, so anyone who can comment
    # is a collaborator anyway — but a mention drives an agent that holds write tokens
    # and runs with --dangerously-skip-permissions, so keep prompt-injection-by-comment
    # closed if the repo ever goes public (issue #129 M3). Label intake needs no extra
    # gate: applying a label already requires triage access.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'bot' && github.event.sender.login != 'infra-lab-bot[bot]' && !github.event.issue.pull_request) ||
      (github.event_name == 'issue_comment' && github.event.sender.login != 'infra-lab-bot[bot]' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && contains(github.event.comment.body, '@infra-lab-bot')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.sender.login != 'infra-lab-bot[bot]' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && contains(github.event.comment.body, '@infra-lab-bot'))
    runs-on: ubuntu-latest
    permissions:
      # Job-token perms still apply to steps that use it (e.g. checkout fallback);
      # the app token below carries its own installation permissions.
      contents: write
      pull-requests: write
      issues: write
      actions: read # so Claude can read CI results on PRs
    steps:
      # Mint a short-lived installation token for the infra-lab-bot GitHub App so all
      # of the bot's activity is attributed to infra-lab-bot[bot].
      - name: Generate infra-lab-bot app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 (Node 24)
        with:
          # Client ID (public, not a secret) — v3 deprecated the numeric `app-id`.
          client-id: Iv23liQcsfKzRONudnfm
          private-key: ${{ secrets.INFRA_LAB_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Use the app token so any commits/pushes are the bot's, not the default runner.
          token: ${{ steps.app-token.outputs.token }}

      # Same-thread session reuse (Feishu dispatches with thread_key only). The whole
      # ~/.claude is cached — session transcripts live in
      # ~/.claude/projects/<cwd-hash>/<uuid>.jsonl and the cwd hash is stable because
      # the runner checkout path is stable. Cache keys are immutable, so each save uses
      # a run_id-unique key and restore-keys prefix-matches the thread's latest entry.
      - name: Restore thread session cache
        if: github.event_name == 'workflow_dispatch' && inputs.thread_key != ''
        uses: actions/cache/restore@v6
        with:
          path: ~/.claude
          key: bot-session-${{ inputs.thread_key }}-${{ github.run_id }}
          restore-keys: |
            bot-session-${{ inputs.thread_key }}-

      # Decide --resume vs --session-id from what the cache actually restored:
      # - session jsonl exists → `--resume <uuid>`: continue the thread's conversation;
      # - missing (first run of the thread, or cache evicted) → `--session-id <uuid>`:
      #   create the session under our stable UUID so the NEXT run can resume it;
      # - no session_uuid (manual dispatch / other events) → no session flag at all.
      # Runs unconditionally so its outputs are always defined for claude_args below.
      - name: Decide session resume mode
        id: session_mode
        env:
          SESSION_UUID: ${{ inputs.session_uuid }}
        run: |
          set -euo pipefail
          if [ -z "${SESSION_UUID:-}" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "claude_session_arg=" >> "$GITHUB_OUTPUT"
            echo "resume mode: none (no session_uuid)" >&2
            exit 0
          fi
          if compgen -G "$HOME/.claude/projects/*/${SESSION_UUID}.jsonl" > /dev/null; then
            echo "mode=resume" >> "$GITHUB_OUTPUT"
            echo "claude_session_arg=--resume ${SESSION_UUID}" >> "$GITHUB_OUTPUT"
            echo "resume mode: resume (jsonl found for ${SESSION_UUID})" >&2
          else
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "claude_session_arg=--session-id ${SESSION_UUID}" >> "$GITHUB_OUTPUT"
            echo "resume mode: fresh (will create session ${SESSION_UUID})" >&2
          fi

      # On manual dispatch, build the prompt = base template (.github/prompts) + the
      # user's (possibly very short) input. The input is passed via env, never inlined
      # into the script, to avoid expression injection. When the run resumes a Feishu
      # thread session, a short mode note is injected so Claude treats the message as a
      # follow-up instead of re-introducing itself.
      - name: Build dispatch prompt
        id: build-prompt
        if: github.event_name == 'workflow_dispatch'
        env:
          USER_PROMPT: ${{ inputs.prompt }}
          SESSION_MODE: ${{ steps.session_mode.outputs.mode }}
        run: |
          {
            echo 'value<<PROMPT_EOF'
            cat .github/prompts/infra-lab-bot.md
            if [ "$SESSION_MODE" = "resume" ]; then
              printf '\n> 本条消息是同一飞书话题的延续，session 已 resume：不要重新自我介绍或复述上次结论，接着这条新消息往下处理。\n'
            elif [ "$SESSION_MODE" = "fresh" ]; then
              printf '\n> 本话题首次会话：正常处理本条消息；同话题的后续追问会自动接续这次 session。\n'
            fi
            printf '\n%s\n' "$USER_PROMPT"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      # On `bot`-label intake, prompt = base template + ticket-mode instructions +
      # the issue reference. Only trusted static text is inlined (the issue number
      # comes from the event, not from user-controlled body text).
      - name: Build ticket prompt
        id: build-ticket-prompt
        if: github.event_name == 'issues'
        env:
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo 'value<<PROMPT_EOF'
            cat .github/prompts/infra-lab-bot.md
            cat .github/prompts/ticket.md
            printf '\n本次工单:REPO=%s ISSUE NUMBER=#%s\n' "$REPO" "$ISSUE_NUMBER"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@af0559ee4f514d1ef21826982bed13f7edc3c35e # v1.0.178
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Act as the custom infra-lab-bot GitHub App instead of the default claude[bot].
          github_token: ${{ steps.app-token.outputs.token }}
          # Mention the bot by its own name rather than the default @claude.
          trigger_phrase: "@infra-lab-bot"
          # apps/bot dispatches this workflow via the infra-lab-bot App token, so the
          # actor is a Bot (infra-lab-bot[bot]). claude-code-action blocks non-human
          # actors by default; allow just this bot (matched case-insensitively, [bot]
          # suffix stripped). Keep it scoped to this bot, NOT "*" — a wildcard would let
          # any App invoke the action (see the action's docs/security.md).
          allowed_bots: "infra-lab-bot"
          # Full tool access so the bot works end-to-end like a real teammate — most
          # importantly it can open its own PRs (`gh pr create`), run git, and invoke
          # pnpm, instead of being limited to claude-code-action's tag-mode tool set.
          # Safe because: (1) the repo is private, so only collaborators can trigger it;
          # (2) main is branch-protected (PR + 1 approval + required CI), so the bot
          # still cannot self-merge or push main whatever tools it has.
          # Use Opus 4.8. The session arg is empty unless this is a Feishu thread
          # dispatch (see "Decide session resume mode").
          claude_args: >-
            --dangerously-skip-permissions
            --model claude-opus-4-8
            ${{ steps.session_mode.outputs.claude_session_arg }}
          # On manual dispatch / label intake, run the composed prompt (automation
          # mode). Empty on comment events so the action stays in mention/tag mode
          # and reacts inline.
          prompt: ${{ (github.event_name == 'workflow_dispatch' && steps.build-prompt.outputs.value) || (github.event_name == 'issues' && steps.build-ticket-prompt.outputs.value) || '' }}
          # Dispatch has no comment thread to reply in, so surface Claude's output in
          # the run log; ticket intake is likewise collaborator-gated (only they can
          # label). Comment runs stay hidden since less-trusted users can fire those.
          show_full_output: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'issues' }}

      # Caches are immutable — save under a run_id-unique key every time; the next run
      # of this thread picks the latest via restore-keys prefix match. always() keeps
      # the save on failed runs too: partial turns already written to session.jsonl are
      # better carried forward than lost.
      - name: Save thread session cache
        if: always() && github.event_name == 'workflow_dispatch' && inputs.thread_key != ''
        uses: actions/cache/save@v6
        with:
          path: ~/.claude
          key: bot-session-${{ inputs.thread_key }}-${{ github.run_id }}

      # Ticket-mode failure visibility: an employee raises a hand instead of going
      # silent — post the run link back to the issue if anything above failed.
      - name: Report failure to issue
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
          --body "⚠️ 接单运行失败,本工单未完成。请查看运行日志:$RUN_URL"

      # Feishu closed loop: when apps/bot dispatched with a feishu_message_id, reply
      # the run's result back into that Feishu thread. `always()` so a failed Claude run
      # still posts a "finished" notice (the script falls back to the run link).
      - name: Reply result to Feishu thread
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.feishu_message_id != ''
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_DOMAIN: ${{ vars.LARK_DOMAIN }}
          FEISHU_MESSAGE_ID: ${{ inputs.feishu_message_id }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/feishu-reply.mjs
