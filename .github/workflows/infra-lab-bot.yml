name: infra-lab-bot

# Mention @infra-lab-bot in an issue comment or a pull-request comment and this
# runs claude-code-action to respond. Auth uses a Claude Code OAuth token (from
# `claude setup-token`), stored as the CLAUDE_CODE_OAUTH_TOKEN repo secret.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  infra-lab-bot:
    # Only run when the mention phrase appears in the comment body. `issue_comment`
    # fires for both issue and PR conversation comments; `pull_request_review_comment`
    # covers inline code-review comments.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@infra-lab-bot')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@infra-lab-bot'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # so Claude can read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Mention the bot by its own name rather than the default @claude.
          trigger_phrase: "@infra-lab-bot"
