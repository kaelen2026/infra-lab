name: release-images

# Build ONE runtime image per release and push it to GHCR, so deploy hosts can
# `docker compose pull` a versioned image instead of building on the box
# (docker-compose.deploy.yml's `--build` stays available for local validation).
#
# Trigger: a pushed PER-APP version tag `{app}_v{version}` (app ∈ api|web|h5|bot,
# version matches the app's package.json), cut from `main`. The app segment
# selects which image builds, so each service releases independently:
#
#   git tag api_v0.1.0 && git push origin api_v0.1.0
#   git tag bot_v0.1.0 && git push origin bot_v0.1.0
#
# Or run manually via workflow_dispatch (pick the app; images are tagged with a
# `manual-<sha>` version). Images: ghcr.io/<owner>/<repo>/<app>:{<version>,latest,sha-<sha>}.
#
# Database migrations are NOT run here — the CD workflow (deploy.yml) triggers on
# the same tag and orders `db-migrate` before `deploy-api`; self-hosted compose
# operators run migrations out-of-band per docs/deployment.md.
#
# NOTE: web/h5 bake their public API origin into the browser bundle at BUILD time
# (NEXT_PUBLIC_API_URL / VITE_API_URL, from repo Variables). One published image
# therefore serves ONE topology; set both Variables before tagging a release.
on:
  push:
    tags: ["api_v*", "web_v*", "h5_v*", "bot_v*"]
  workflow_dispatch:
    inputs:
      app:
        description: "Which app image to build"
        required: true
        type: choice
        options: [api, web, h5, bot]

# The GITHUB_TOKEN only needs to read the repo and publish packages.
permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Derive the target app + version label from the tag (`{app}_v{version}`) or the
  # manual dispatch input, and reject anything that isn't a known app.
  resolve:
    name: Resolve app + version
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.resolve.outputs.app }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve from tag / input
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          APP_INPUT: ${{ inputs.app }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$APP_INPUT" ]; then
            app="$APP_INPUT"
            version="manual-${SHA:0:7}"
          else
            app="${REF_NAME%%_*}"         # api_v0.1.0 -> api
            version="${REF_NAME#*_v}"     # api_v0.1.0 -> 0.1.0
          fi
          case "$app" in
            api|web|h5|bot) ;;
            *) echo "::error::unrecognized app segment '$app' in ref '$REF_NAME' (expected {api|web|h5|bot}_v{version})"; exit 1 ;;
          esac
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-push:
    name: Build & push ${{ needs.resolve.outputs.app }}
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Enforce the tag ↔ source invariant: the version in `{app}_v{version}` must
      # equal that app's package.json version. Skipped for manual dispatch (whose
      # version is `manual-<sha>`, not a release version).
      - name: Verify tag version matches package.json
        if: github.event_name == 'push'
        env:
          APP: ${{ needs.resolve.outputs.app }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          pkg_version="$(node -p "require('./apps/${APP}/package.json').version")"
          if [ "$pkg_version" != "$VERSION" ]; then
            echo "::error::tag version '$VERSION' != apps/${APP}/package.json version '$pkg_version' — bump the package.json or fix the tag"
            exit 1
          fi
          echo "apps/${APP} package.json version $pkg_version matches the tag."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag scheme: the version segment from the tag (e.g. 20260711), a rolling
      # `latest` for that app, plus the commit sha for exact pinning.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ needs.resolve.outputs.app }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      # Fail fast instead of silently publishing a web image with the Dockerfile's
      # localhost default baked into the browser bundle (same strictness as the
      # deploy compose's `:?` expansion). h5 is exempt: an empty VITE_API_URL is a
      # legitimate same-origin build.
      - name: Preflight browser-bundle origin
        if: needs.resolve.outputs.app == 'web' && vars.NEXT_PUBLIC_API_URL == ''
        run: >-
          echo "::error::repo Variable NEXT_PUBLIC_API_URL is not set — the published web
          image would call http://localhost:3001 from every browser. Set it under
          Settings → Secrets and variables → Actions → Variables, then re-tag."
          && exit 1

      # Build args beyond what an app's Dockerfile declares are ignored with a
      # warning, so the browser-bundle origins can be passed uniformly here.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ needs.resolve.outputs.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
