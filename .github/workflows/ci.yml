name: CI

# Quality gate: every push to `main` and every PR must pass lint, typecheck,
# build, and the hermetic test suite before it can be merged. `main` is the only
# long-lived branch and every change reaches it through a PR; production ships
# from a per-app version tag `v{app}-{date}` (see docs/deployment.md).
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the quality gate only reads the repo. Without this the jobs run
# PR-authored build scripts while holding the repo's default (possibly writable)
# GITHUB_TOKEN (issue #129 M1).
permissions:
  contents: read

env:
  # Keep turbo output uncoloured and CI-friendly.
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm version is read from the root package.json "packageManager" field.
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tests are hermetic (no live PG/Redis), but turbo lists .env as a global
      # dependency and `next build` reads it — seed it from the checked-in example.
      - name: Seed .env
        run: cp .env.example .env

      - name: Lint (biome)
        run: pnpm lint

      # `typecheck` depends on `^build` in turbo, so dependency packages get built first.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The single source of truth for color + copy lives in `@infra/design`.
      # Regenerate every client's artifacts and fail if any drifted — the only way
      # to change a brand color or auth string is to change the source, not a
      # generated file. Runs after Build because the generator imports built @infra/shared.
      # Scoped to the generated paths so unrelated build artifacts can't fail it.
      - name: Design tokens · no drift
        run: |
          pnpm gen:design
          git diff --exit-code -- \
            apps/web/app/tokens.generated.css \
            apps/h5/src/tokens.generated.css \
            apps/ios/InfraLab/Generated \
            apps/android/app/src/main/kotlin/dev/w3ctech/infralab/ui/theme/DesignTokens.kt \
            apps/android/app/src/main/kotlin/dev/w3ctech/infralab/ui/auth/AuthCopyGenerated.kt \
            apps/android/app/src/main/res/values/colors.generated.xml \
            apps/android/app/src/main/res/values-night/colors.generated.xml \
            apps/harmony/entry/src/main/resources/base/element/color.json \
            apps/harmony/entry/src/main/ets/sdk/copy.generated.ets \
            apps/miniprogram/miniprogram/tokens.generated.wxss \
            apps/miniprogram/miniprogram/theme.json

      - name: Test (vitest)
        run: pnpm test

      # @infra/icon is a browser-only Next app whose component tests need a DOM
      # (happy-dom), so they run under the app's own vitest config rather than the
      # root node-env hermetic suite.
      - name: Test · @infra/icon (vitest, happy-dom)
        run: pnpm --filter @infra/icon test

  actionlint:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Lints every .github/workflows/*.yml; the image bundles shellcheck, which
      # actionlint runs on `run:` steps too. Pinned to match local tooling.
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  commitlint:
    name: Commit messages (Conventional Commits)
    runs-on: ubuntu-latest
    # Commit-message linting only makes sense for the commits a PR introduces.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need full history to lint the PR's range of commits.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint PR commits
        run: >-
          pnpm exec commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose
