# nginx config for the h5 SPA container (see docs/deployment.md).
#
# This container serves ONLY the static app + SPA history fallback. In the
# recommended same-origin topology, TLS is terminated at the edge/ingress in front
# of this container, and that edge also routes API paths to the API — so the
# browser sees a single origin and the session cookie stays first-party.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Content-hashed bundles never change under a given name → cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # All-in-one alternative: uncomment to have THIS container proxy the API too
  # (build h5 with VITE_API_URL="" for relative calls). Point at your API host.
  # location ~ ^/(auth|todos|timeline|uploads|admin|notifications|api/auth)(/|$) {
  #   proxy_pass         http://api:3001;
  #   proxy_set_header   Host $host;
  #   proxy_set_header   X-Real-IP $remote_addr;
  #   proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header   X-Forwarded-Proto $scheme;
  # }

  # SPA history fallback: unmatched paths serve the app shell so deep links /
  # refreshes on /auth and /todos resolve. index.html itself must not be cached.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
