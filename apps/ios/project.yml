# XcodeGen spec — regenerate the project with `xcodegen generate` (or `make project`).
# The .xcodeproj is derived, so it is gitignored; this file is the source of truth.
name: InfraLab
options:
  bundleIdPrefix: dev.w3ctech.infralab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sign ad-hoc ("Sign to Run Locally") with no team. Manual style keeps the
    # build fully offline: Automatic signing tries to fetch a provisioning
    # profile from the developer portal, which fails ("PLA Update available")
    # for anyone whose Apple account hasn't accepted the latest agreement —
    # and a simulator/lab build needs no account at all. Device builds: set
    # CODE_SIGN_STYLE=Automatic + DEVELOPMENT_TEAM (kept out of source control).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Build-time API endpoint override, substituted into Info.plist's
    # API_BASE_URL (see AppConfig.swift). Empty → the app falls back to
    # http://localhost:3001. Release builds pass it via `make ... API_URL=…`
    # so no machine-specific address is ever committed.
    API_BASE_URL: ""
    # Origin of the h5 share landing (`/t/:id`), substituted into Info.plist's
    # SHARE_BASE_URL (see AppConfig.swift). Empty → http://localhost:3002, the
    # h5 dev server.
    SHARE_BASE_URL: ""
    # Google Sign-In OAuth *iOS client id* (Google Cloud → Credentials → iOS client),
    # substituted into Info.plist's GIDClientID (see GoogleConfig in AppConfig.swift).
    # Empty → the Google button is hidden and the app injects the
    # UnavailableGoogleSignInProvider, so the app builds / runs / tests with no Google
    # config. NEVER commit a real id — pass it at build time, e.g.
    #   make build GID_CLIENT_ID=<id>.apps.googleusercontent.com \
    #              GID_REVERSED_CLIENT_ID=com.googleusercontent.apps.<id>
    GID_CLIENT_ID: ""
    # The "reversed" client id (Google Cloud iOS client → "iOS URL scheme"), registered
    # below as a CFBundleURLScheme so Google can redirect back after the browser handoff.
    # Empty placeholder until configured; harmless when blank (no real Google flow runs).
    GID_REVERSED_CLIENT_ID: ""

packages:
  # Google Sign-In SDK. XcodeGen resolves it via SPM and regenerates the (gitignored)
  # .xcodeproj — do not hand-edit project.pbxproj. `GoogleSignIn` is the SDK,
  # `GoogleSignInSwift` provides the self-localized SwiftUI button.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"

targets:
  InfraLab:
    type: application
    platform: iOS
    sources:
      - path: InfraLab
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.w3ctech.infralab
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        # Xcode 16 splits the app into a preview "debug dylib"; that breaks
        # hosted unit tests run via xcodebuild (runner crashes at <external symbol>).
        ENABLE_DEBUG_DYLIB: false
        # Push Notifications capability (aps-environment). Simulator ignores it; a
        # device / TestFlight build needs a provisioning profile that carries the
        # Push Notifications entitlement (Automatic signing + DEVELOPMENT_TEAM).
        CODE_SIGN_ENTITLEMENTS: InfraLab/InfraLab.entitlements
    info:
      path: InfraLab/Info.plist
      properties:
        CFBundleDisplayName: Infra Lab
        # Segment A — the system static launch window. Paint it with the
        # LaunchBackground colorset (paper #FCFAF4 / charcoal #13110F) so a dark
        # cold-start never flashes white before the SwiftUI splash takes over.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad multitasking requires all four orientations (ITMS-90474);
        # the SwiftUI form adapts, so allow them all on iPad only.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        API_BASE_URL: $(API_BASE_URL)
        SHARE_BASE_URL: $(SHARE_BASE_URL)
        # The GoogleSignIn SDK reads GIDClientID from Info.plist. Empty when
        # unconfigured — GoogleConfig treats a blank value as "disabled", hides the
        # button and injects UnavailableGoogleSignInProvider.
        GIDClientID: $(GID_CLIENT_ID)
        # Custom scheme for deep links (mirror of TIMELINE_APP_SCHEME in
        # @infra/shared): the h5 share landing opens infralab://timeline/<id>.
        # The second entry is Google Sign-In's redirect scheme (the reversed client
        # id); blank placeholder until GID_REVERSED_CLIENT_ID is set.
        CFBundleURLTypes:
          - CFBundleURLName: dev.w3ctech.infralab
            CFBundleURLSchemes:
              - infralab
          - CFBundleURLName: dev.w3ctech.infralab.google
            CFBundleURLSchemes:
              - $(GID_REVERSED_CLIENT_ID)
        # Camera access for the timeline composer (taking a photo to publish) and
        # the QR login scanner (account sheet). Library picking uses PhotosPicker
        # (PHPicker, out-of-process), which needs no permission, so only the
        # camera usage string is required.
        NSCameraUsageDescription: 拍照以在动态中发布图片，或扫描网页端的登录二维码。
        # Lab app: the API is a dev server reached over cleartext HTTP
        # (localhost or a LAN IP via API_BASE_URL), so allow arbitrary loads.
        # Distribution is TestFlight-only; revisit before any App Store release.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        # Standard HTTPS only — exempt from export compliance, so TestFlight
        # builds skip the per-build encryption questionnaire.
        ITSAppUsesNonExemptEncryption: false

  InfraLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InfraLabTests
    dependencies:
      - target: InfraLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  InfraLab:
    build:
      targets:
        InfraLab: all
    test:
      targets:
        - InfraLabTests
